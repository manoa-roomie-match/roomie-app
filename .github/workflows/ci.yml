name: ci-roomie-app

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roomie_app
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roomie_app
      NEXTAUTH_SECRET: dev-secret-please-change
      NEXTAUTH_URL: http://127.0.0.1:3000
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Seed database
        run: npx prisma db seed
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Run acceptance tests
        run: PLAYWRIGHT_TEST_BASE_URL=http://127.0.0.1:3000 npx playwright test --project=chromium
